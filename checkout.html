<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Finalizar compra — Canchero de Barrio</title><style>
*{box-sizing:border-box}body{margin:0;background:#efeadd;color:#111;font-family:Arial,sans-serif}.wrap{width:min(1100px,92%);margin:auto}.top{background:#111;color:#fff;padding:18px 0}.top .wrap{display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none}.logo{font-weight:900;letter-spacing:1px}.checkout{padding:45px 0}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:30px}.card{background:#fff;border:1px solid #ddd;padding:25px}.card h1,.card h2{margin-top:0;text-transform:uppercase}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:grid;gap:6px;margin-bottom:14px;font-weight:700}input,textarea{width:100%;padding:12px;border:1px solid #bbb;font:inherit}textarea{min-height:90px}.item{border-bottom:1px solid #ddd;padding:14px 0}.item:last-child{border-bottom:0}.item{display:grid;grid-template-columns:auto 1fr;gap:12px}.item-thumb{width:76px;height:76px;border:1px solid #ddd;background:#efeadd;overflow:hidden}.item-thumb img{width:100%;height:100%;object-fit:cover}.item-content{min-width:0}.item strong{display:block}.item small{color:#666}.total{display:flex;justify-content:space-between;font-size:22px;font-weight:900;border-top:2px solid #111;padding-top:18px;margin-top:10px}.pay{width:100%;background:#111;color:#fff;border:0;padding:15px;font-weight:900;text-transform:uppercase;cursor:pointer;margin-top:18px}.note{font-size:13px;color:#666;line-height:1.5}.empty{text-align:center;padding:60px 10px}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="wrap"><a class="logo" href="index.html">CANCHERO DE BARRIO</a><a href="index_final.html">← Seguir comprando</a></div></header>
<main class="checkout"><div class="wrap"><div class="grid"><section class="card"><h1>Datos de entrega</h1><form id="orderForm"><div class="row"><label>Nombre<input required id="name"></label><label>Teléfono<input required id="phone"></label></div><label>Correo electrónico<input type="email" required id="email"></label><label>Dirección de entrega<textarea required id="address"></textarea></label><label>Ciudad<input required id="city" value="Bogotá"></label><button class="pay" type="submit">Continuar al pago</button><p class="note">Esta versión deja listo el pedido y el resumen del carrito. Para cobrar en línea de forma real hay que conectar una pasarela como Wompi, Mercado Pago o PayU con las credenciales de la tienda.</p></form></section><aside class="card"><h2>Tu pedido</h2><div id="items"></div><div class="total"><span>Total</span><span id="total">$0 COP</span></div></aside></div></div></main>
<script src="cart.js"></script><script>
function renderCheckout(){const c=CancheroCart.get(),box=document.getElementById('items');if(!c.length){box.innerHTML='<div class="empty">Tu carrito está vacío.<br><br><a href="index.html">Volver a la tienda</a></div>';document.querySelector('.pay').disabled=true;return}box.innerHTML=c.map(x=>`<div class="item">${x.designImage?`<div class="item-thumb"><img src="${x.designImage}" alt="Diseño seleccionado"></div>`:'<div></div>'}<div class="item-content"><strong>${x.name}</strong>${x.type==='custom'?`<small>Prenda: ${x.modelName||''}<br>Talla: ${x.size||''}<br>Diseño: ${x.designName||'Sin diseño'}<br>Color: <span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${x.color||'#ccc'};border:1px solid #999"></span> ${x.colorName||x.color||''}<br>Cantidad: ${x.qty}</small>`:`<small>${x.details||''} · cantidad ${x.qty}</small>`}<div>${CancheroCart.money(x.price*x.qty)}</div></div></div>`).join('');document.getElementById('total').textContent=CancheroCart.money(CancheroCart.total(c));}
document.addEventListener('DOMContentLoaded',()=>{renderCheckout();document.getElementById('orderForm').addEventListener('submit',e=>{e.preventDefault();const c=CancheroCart.get();const order={customer:{name:name.value,phone:phone.value,email:email.value,address:address.value,city:city.value},items:c,total:CancheroCart.total(c),createdAt:new Date().toISOString()};localStorage.setItem('canchero_last_order',JSON.stringify(order));alert('Pedido preparado. El siguiente paso es conectar la pasarela de pago.');});});
</script></body></html>
