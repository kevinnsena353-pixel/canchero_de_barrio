<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canchero — Pedidos</title>
<style>
:root{--blue:#2e59a5;--black:#0a0a0a;--cream:#f4f2ea}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Arial;color:#0a0a0a}header{background:#0a0a0a;color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}main{max-width:1280px;margin:auto;padding:28px}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}input,select,button{padding:10px 12px;border:1px solid #ccc;border-radius:6px;font:inherit}button{background:#0a0a0a;color:#fff;cursor:pointer}.panel,.detail{background:#fff;border:1px solid #ddd;border-radius:10px;overflow:auto}.detail{margin-top:20px;padding:22px}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.item{padding:14px;margin-top:10px;background:var(--cream);border-radius:8px}.muted{color:#6b7280}@media(max-width:700px){main{padding:16px}}
</style></head><body>
<header><strong>CANCHERO — PEDIDOS</strong><button id="logout">Cerrar</button></header>
<main><div class="toolbar"><div><input id="token" type="password" placeholder="ADMIN_TOKEN"><button id="login">Entrar</button></div><button id="refresh">Actualizar</button></div>
<div class="panel"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Pago</th><th>Pedido</th><th>Fecha</th><th></th></tr></thead><tbody id="orders"></tbody></table></div>
<section id="detail" class="detail" hidden></section></main>
<script>
let token=sessionStorage.getItem("canchero_admin_token")||"";const $=id=>document.getElementById(id);$("token").value=token;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const money=c=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(c/100);
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token,"Content-Type":"application/json"};const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Error");return d}
async function load(){if(!token)return;try{const d=await api("/api/orders");$("orders").innerHTML=d.orders.map(o=>`<tr><td><b>${esc(o.reference)}</b></td><td>${esc(o.customer_name)}<br><span class="muted">${esc(o.customer_email)}</span></td><td>${money(o.total_cents)}</td><td>${esc(o.payment_status)}</td><td>${esc(o.order_status)}</td><td>${new Date(o.created_at).toLocaleString("es-CO")}</td><td><button onclick="showOrder(${o.id})">Ver</button></td></tr>`).join("")}catch(e){alert(e.message)}}
window.showOrder=async id=>{try{const d=await api("/api/orders/"+id),o=d.order;$("detail").hidden=false;$("detail").innerHTML=`<h2>${esc(o.reference)}</h2><p><b>Cliente:</b> ${esc(o.customer_name)} · ${esc(o.customer_phone)} · ${esc(o.customer_email)}</p><p><b>Entrega:</b> ${esc(o.shipping_address)}, ${esc(o.shipping_city)}</p><p><b>Total:</b> ${money(o.total_cents)}</p><label>Estado pedido <select id="os">${["new","processing","ready","shipped","completed","cancelled"].map(x=>`<option ${x===o.order_status?"selected":""}>${x}</option>`).join("")}</select></label> <label>Pago <select id="ps">${["pending","approved","declined","voided","error"].map(x=>`<option ${x===o.payment_status?"selected":""}>${x}</option>`).join("")}</select></label> <button onclick="saveStatus(${o.id})">Guardar</button><h3>Productos</h3>${d.items.map(i=>`<div class="item"><b>${esc(i.name)}</b> × ${i.quantity}<br>Tipo: ${esc(i.type)}${i.garment?"<br>Prenda: "+esc(i.garment):""}${i.size?"<br>Talla: "+esc(i.size):""}${i.color?"<br>Color: "+esc(i.color):""}${i.design_name?"<br>Diseño: "+esc(i.design_name):""}${i.design_src?"<br>Archivo: "+esc(i.design_src):""}<br>Precio: ${money(i.unit_price_cents)}</div>`).join("")}`}catch(e){alert(e.message)}};
window.saveStatus=async id=>{try{await api("/api/orders/"+id+"/status",{method:"PATCH",body:JSON.stringify({orderStatus:$("os").value,paymentStatus:$("ps").value})});await load();await showOrder(id)}catch(e){alert(e.message)}};
$("login").onclick=()=>{token=$("token").value.trim();sessionStorage.setItem("canchero_admin_token",token);load()};$("refresh").onclick=load;$("logout").onclick=()=>{sessionStorage.removeItem("canchero_admin_token");token="";$("orders").innerHTML="";$("detail").hidden=true;$("token").value=""};load();
</script></body></html>
